# Prometheus scrape config (§10). Scrapes the web + worker /metrics endpoints
# (exposed in prod) and itself. Alert rules in alerts.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: vaidyasala-web
    metrics_path: /api/metrics
    static_configs:
      - targets: ["vaidyasala-web:3000"]

  - job_name: vaidyasala-worker
    static_configs:
      - targets: ["vaidyasala-worker:9091"]
