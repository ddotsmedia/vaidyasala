upstream vaidhyasala_backend {
  server 127.0.0.1:8888;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name vaidhyasala.com www.vaidhyasala.com;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name vaidhyasala.com www.vaidhyasala.com;
  ssl_certificate /etc/letsencrypt/live/vaidhyasala.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vaidhyasala.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;
  access_log /var/log/nginx/vaidhyasala.com.access.log;
  error_log /var/log/nginx/vaidhyasala.com.error.log;
  location / {
    proxy_pass http://vaidhyasala_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
  location /health {
    proxy_pass http://vaidhyasala_backend;
    access_log off;
  }
  location ~ /\.env {
    deny all;
  }
}
