name: Deploy

# Phase 7A. Builds multi-stage images to GHCR, then deploys to the SHARED VPS.
#
# ⚠️ LAW 6. This server runs 10 other live sites. The deploy job only ever touches
# containers in the `vaidyasala` compose project. It never runs `docker restart` on
# anything else, never prunes, never touches the reverse proxy.
#
# Gates:
#   vars.ENABLE_DEPLOY == 'true'  → the ssh deploy job runs at all.
#   workflow_dispatch build_only  → build+push images without deploying (use this
#                                   to prove the Dockerfiles before the first deploy).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and push images, skip the VPS deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-push:
    name: build + push images (GHCR)
    if: ${{ vars.ENABLE_DEPLOY == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.app }}
          push: true
          # The web build prerenders DB-backed pages. With no DATABASE_URL the
          # image still builds (generateStaticParams degrades to on-demand), but
          # any top-level DB query fails the export — so set the BUILD_DATABASE_URL
          # secret to a database reachable from the runner if you want those
          # pages prerendered here rather than on first request.
          build-args: |
            DATABASE_URL=${{ secrets.BUILD_DATABASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to VPS
    needs: build-push
    if: ${{ vars.ENABLE_DEPLOY == 'true' && !inputs.build_only }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: GITHUB_SHA,GITHUB_ACTOR,REGISTRY_TOKEN,DEPLOY_DIR
          script: |
            set -euo pipefail
            # The repo has disagreed with itself about /opt/vaidyasala vs
            # /opt/vaidhyasala. Configurable, and fails loudly rather than
            # deploying into a directory that does not exist.
            DEPLOY_DIR="${DEPLOY_DIR:-/opt/vaidyasala}"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "✗ $DEPLOY_DIR does not exist. Set the DEPLOY_DIR repo variable"
              echo "  to the directory this project actually uses on the server."
              exit 1
            fi
            cd "$DEPLOY_DIR"

            COMPOSE="docker compose -p vaidyasala -f compose.prod.yml"
            PREV_TAG="$(grep -E '^TAG=' .env | cut -d= -f2 || echo latest)"
            echo "previous tag: ${PREV_TAG} → new tag: ${GITHUB_SHA}"

            # Snapshot every container NOT ours, so we can prove we left the 10
            # live sites alone. This is the single most important check here.
            docker ps --format '{{.Names}}\t{{.Status}}' \
              | grep -v '^vaidyasala-' | sort > /tmp/others.before

            echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            sed -i "s/^TAG=.*/TAG=${GITHUB_SHA}/" .env
            $COMPOSE pull web worker

            # Migrations before the new code serves traffic (additive only, LAW 5).
            # The Prisma CLI is a devDependency of @vaidyasala/db, so under pnpm
            # it resolves at packages/db/node_modules/prisma — NOT at the repo
            # root, which is where this used to look. Both paths are tried so a
            # change to pnpm's node-linker does not silently break deploys.
            $COMPOSE run --rm --no-deps --entrypoint sh worker -c '
              for p in packages/db/node_modules/prisma/build/index.js \
                       node_modules/prisma/build/index.js; do
                if [ -f "$p" ]; then
                  exec node "$p" migrate deploy --schema packages/db/prisma/schema
                fi
              done
              echo "✗ prisma CLI not found in the worker image"; exit 1
            '

            # Rolling restart of OUR services only — named explicitly, never a
            # bare `docker restart` and never `$COMPOSE restart` without args.
            $COMPOSE up -d --no-deps web worker

            # Smoke check on the loopback port.
            WEB_PORT="$(grep -E '^WEB_PORT=' .env | cut -d= -f2)"
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${WEB_PORT}/api/health" >/dev/null; then ok=1; break; fi
              sleep 2
            done

            if [ "$ok" -ne 1 ]; then
              echo "✗ smoke check failed — rolling back to ${PREV_TAG}"
              sed -i "s/^TAG=.*/TAG=${PREV_TAG}/" .env
              $COMPOSE up -d --no-deps web worker    # our images only
              docker ps --format '{{.Names}}\t{{.Status}}' \
                | grep -v '^vaidyasala-' | sort > /tmp/others.after
              diff /tmp/others.before /tmp/others.after || echo "!! other sites changed — investigate"
              exit 1
            fi

            # If the image was built without a database, the listing pages were
            # prerendered empty. Force them to regenerate now that the real DB
            # is reachable, rather than serving a blank site until ISR expires.
            REVALIDATE_TOKEN="$(grep -E '^(REVALIDATE_TOKEN|ADMIN_INGEST_TOKEN)=' .env | head -1 | cut -d= -f2-)"
            if [ -n "$REVALIDATE_TOKEN" ]; then
              curl -fsS -X POST "http://127.0.0.1:${WEB_PORT}/api/internal/revalidate" \
                -H "authorization: Bearer ${REVALIDATE_TOKEN}" >/dev/null \
                && echo "✓ listing pages revalidated" \
                || echo "! revalidation failed — check the listing pages by hand"
            else
              echo "! no REVALIDATE_TOKEN/ADMIN_INGEST_TOKEN in .env — skipping revalidation"
            fi

            # Prove the other 10 sites are byte-identical in name+status.
            docker ps --format '{{.Names}}\t{{.Status}}' \
              | grep -v '^vaidyasala-' | sort > /tmp/others.after
            if ! diff /tmp/others.before /tmp/others.after; then
              echo "!! containers outside our project changed during deploy — investigate immediately"
              exit 1
            fi

            echo "✓ deployed ${GITHUB_SHA}; no container outside the vaidyasala project changed"
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
