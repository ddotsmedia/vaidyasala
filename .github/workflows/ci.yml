name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://vaidyasala:vaidyasala@localhost:5432/vaidyasala?schema=public
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  MEILI_URL: http://localhost:7700

jobs:
  quality:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vaidyasala
          POSTGRES_PASSWORD: vaidyasala
          POSTGRES_DB: vaidyasala
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaidyasala -d vaidyasala"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: DB migrate + seed
        run: |
          pnpm --filter @vaidyasala/db migrate
          pnpm --filter @vaidyasala/db seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e-perf:
    name: e2e · lighthouse
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vaidyasala
          POSTGRES_PASSWORD: vaidyasala
          POSTGRES_DB: vaidyasala
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaidyasala -d vaidyasala"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: DB migrate + seed
        run: |
          pnpm --filter @vaidyasala/db migrate
          pnpm --filter @vaidyasala/db seed

      - name: Build web
        run: pnpm --filter @vaidyasala/web build

      - name: Install Playwright browsers
        run: pnpm --filter @vaidyasala/web e2e:install

      - name: Playwright e2e
        run: pnpm --filter @vaidyasala/web e2e

      - name: Lighthouse CI budgets
        run: pnpm dlx @lhci/cli@0.14.x autorun
